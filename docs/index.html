<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f6f2">
<title>설교 아카이브</title>
<style>
:root{color-scheme:light;--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--sub:#6b7280;--line:#e5e2d9;--acc:#2f5d50;--accbg:#e4eee9;--hov:#f1efe8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{padding:28px 16px 8px;max-width:960px;margin:0 auto}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--sub);font-size:14px}
.bar{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);z-index:5}
.bar .in{max-width:960px;margin:0 auto;display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
.bar input[type=search]{grid-column:1/-1}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
main{max-width:960px;margin:0 auto;padding:8px 16px 60px}.meta{color:var(--sub);font-size:13px;margin:8px 0}
.ym{margin:20px 0 6px;font-size:14px;font-weight:700;color:var(--acc);border-bottom:2px solid var(--accbg);padding-bottom:4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details{border-top:1px solid var(--line)}details:first-child{border-top:0}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px 100px 130px 1fr 18px;gap:10px;align-items:baseline;padding:12px 14px}
summary::-webkit-details-marker{display:none}summary:hover{background:var(--hov)}
summary::after{content:"▸";color:var(--sub);justify-self:end;transition:transform .15s}
details[open]>summary::after{transform:rotate(90deg)}details[open]>summary{background:var(--hov)}
.d{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}.c{font-size:14px}.p{font-size:14px}.t{font-weight:600}
.c,.p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dim{color:var(--sub)}
.body{padding:4px 16px 16px 16px;background:var(--hov)}
.body .sc{color:var(--sub);font-size:13.5px;margin:2px 0 8px}.body p{margin:0 0 8px;font-size:15px}
.body ul{margin:6px 0 8px;padding-left:20px;font-size:14.5px}.body li{margin:3px 0}
blockquote{margin:10px 0;padding:4px 12px;border-left:3px solid var(--acc);color:var(--sub);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:var(--accbg);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:12.5px}
.src{display:inline-block;margin-top:4px;padding:7px 14px;border-radius:8px;background:var(--acc);color:var(--bg);text-decoration:none;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.more{display:block;margin:16px auto;padding:10px 24px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
@media(max-width:640px){
 .bar .in{grid-template-columns:1fr 1fr}.bar select:last-child{grid-column:1/-1}
 summary{grid-template-columns:1fr 18px;gap:2px 8px;padding:12px}
 summary .t{grid-column:1;grid-row:2;font-size:16px}summary .d{grid-column:1;grid-row:1}
 summary .c,summary .p{display:none}summary::after{grid-column:2;grid-row:1/3;align-self:center}
 summary .sub2{display:block;grid-column:1;grid-row:3;color:var(--ink);font-size:15px;font-weight:700;margin-top:2px}
 summary .t{font-size:17px;font-weight:700}
}
@media(min-width:641px){summary .sub2{display:none}}
</style>
</head>
<body>
<header><h1>설교 아카이브</h1><p id="sub">불러오는 중…</p></header>
<div class="bar"><div class="in">
<input id="q" type="search" placeholder="제목·목사·교회·성경·요약 검색">
<select id="fy"><option value="">전체 연도</option></select>
<select id="fp"><option value="">전체 목사</option></select>
<select id="ft"><option value="">전체 주제</option></select>
</div></div>
<main><div class="meta" id="meta"></div><div id="list"></div><button class="more" id="more" hidden>더 보기</button></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ALL=[],VIEW=[],SHOWN=0;const PAGE=40;
fetch("sermons.json").then(r=>r.json()).then(d=>{ALL=d.items;init()}).catch(()=>{$("#sub").textContent="데이터를 불러오지 못했습니다."});
function init(){
 [...new Set(ALL.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a).forEach(v=>$("#fy").add(new Option(v+"년",v)));
 const pc={};ALL.forEach(r=>r.preacher&&(pc[r.preacher]=(pc[r.preacher]||0)+1));
 Object.entries(pc).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>$("#fp").add(new Option(`${k} (${n})`,k)));
 [...new Set(ALL.flatMap(r=>r.topics||[]))].sort().forEach(v=>$("#ft").add(new Option(v,v)));
 if(!$("#ft").options[1])$("#ft").hidden=true;
 $("#sub").textContent=`총 ${ALL.length}편 · 일자순 · 제목을 누르면 요약이 열립니다`;
 ["q","fy","fp","ft"].forEach(i=>$("#"+i).addEventListener("input",apply));apply()}
function apply(){
 const q=$("#q").value.trim().toLowerCase(),y=$("#fy").value,p=$("#fp").value,t=$("#ft").value;
 VIEW=ALL.filter(r=>(!y||r.year==y)&&(!p||r.preacher===p)&&(!t||(r.topics||[]).includes(t))&&
  (!q||[r.title,r.preacher,r.church,r.scripture?.raw,r.summary_short,...(r.topics||[]),...(r.key_points||[])].join(" ").toLowerCase().includes(q)));
 SHOWN=0;render()}
function row(r){
 const who=[r.church,r.preacher].filter(Boolean).join(" · ")||"설교자 미상";
 const d=r.date||r.published||"";
 return `<details><summary><span class="d">${esc(d)}</span><span class="c ${r.church?"":"dim"}">${esc(r.church||"-")}</span><span class="p ${r.preacher?"":"dim"}">${esc(r.preacher||"미상")}</span><span class="t">${esc(r.title||"(제목 없음)")}</span><span class="sub2">${esc(who)}</span></summary>
 <div class="body">${r.scripture?`<div class="sc">본문 ${esc(r.scripture.raw)}</div>`:""}
 ${r.summary_short?`<p>${esc(r.summary_short)}</p>`:'<p class="dim">요약이 없습니다.</p>'}
 ${(r.key_points||[]).length?`<ul>${r.key_points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
 ${r.key_quote?`<blockquote>${esc(r.key_quote)}</blockquote>`:""}
 ${(r.topics||[]).length?`<div class="tags">${r.topics.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
 <a class="src" href="${esc(r.source_url)}" target="_blank" rel="noopener">원문 보기</a></div></details>`}
function render(){
 const box=$("#list");
 SHOWN=Math.min(SHOWN+PAGE,VIEW.length);
 let html="",last=null;
 VIEW.slice(0,SHOWN).forEach(r=>{
  const ym=(r.date||r.published||"").slice(0,7);
  if(ym!==last){if(last!==null)html+="</div>";html+=`<div class="ym">${ym.replace("-","년 ")}월</div><div class="list">`;last=ym}
  html+=row(r)});
 if(last!==null)html+="</div>";
 box.innerHTML=VIEW.length?html:'<div class="empty">조건에 맞는 설교가 없습니다.</div>';
 $("#meta").textContent=VIEW.length?`${VIEW.length}편`:"";
 $("#more").hidden=SHOWN>=VIEW.length}
$("#more").onclick=render;
</script>
</body>
</html>
